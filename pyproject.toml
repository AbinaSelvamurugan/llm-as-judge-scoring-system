[build-system]
requires = ["setuptools>=75,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgebench"
version = "0.1.0"
description = "Rubric-based Claude LLM judging and audited human agreement"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
dependencies = [
 "anthropic==1.13.0", "pydantic==2.13.5", "PyYAML==6.0.3",
 "pandas==2.2.3", "numpy==2.3.5", "scikit-learn==1.8.0",
 "scipy==1.17.0", "statsmodels==0.14.6", "streamlit==1.65.0",
 "plotly==6.5.2",
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.16.8"]
[project.scripts]
judgebench = "judgebench.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
exclude = [".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
