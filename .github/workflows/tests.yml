name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / offline suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      JUDGEBENCH_OFFLINE: '1'
      PYTHONPATH: src
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Compile Python source files
        run: python -m compileall -q src app scripts tests
      - name: Run credential-free tests
        run: python -m pytest -q
      - name: Validate rubric and dataset via CLI
        run: |
          python scripts/run_cli.py --db "$RUNNER_TEMP/judgebench-ci.sqlite3" init
          python scripts/run_cli.py --db "$RUNNER_TEMP/judgebench-ci.sqlite3" rubric-check --rubric configs/rubric.yaml
          python scripts/run_cli.py --db "$RUNNER_TEMP/judgebench-ci.sqlite3" dataset-validate data/synthetic_fixture.jsonl
          python scripts/run_cli.py --db "$RUNNER_TEMP/judgebench-ci.sqlite3" dataset-import data/synthetic_fixture.jsonl
